<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RabbitEars TV — Web Player</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <link rel="stylesheet" href="player.css">
  <!-- hls.js enables HLS (.m3u8) playback in browsers without native support -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <script src="player.js" defer></script>
</head>
<body>
  <div id="app">
    <!-- ===== Screen ===== -->
    <section class="screen-wrap">
      <div class="screen" id="screen">
        <video id="video" playsinline></video>
        <iframe id="yt" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>

        <!-- TV static / channel-change effect -->
        <canvas id="static" class="static"></canvas>

        <!-- Subtle CRT scanline overlay -->
        <div class="scanlines"></div>

        <!-- On-screen channel banner -->
        <div class="osd" id="osd">
          <span class="osd-chan" id="osd-chan">--</span>
          <span class="osd-name" id="osd-name"></span>
        </div>

        <!-- "No signal" message -->
        <div class="no-signal" id="no-signal">
          <div class="ns-bars"></div>
          <p>NO SIGNAL</p>
        </div>

        <!-- Tap to unmute hint (autoplay starts muted) -->
        <button class="unmute-hint" id="unmute-hint" hidden>🔇 Tap to unmute</button>
      </div>

      <div class="screen-controls">
        <button class="sc-btn" id="btn-mute" title="Mute / Unmute">🔇</button>
        <input type="range" id="volume" min="0" max="1" step="0.05" value="1" title="Volume">
        <span class="spacer"></span>
        <button class="sc-btn" id="btn-edit" title="Edit channels">☰ Channels</button>
        <button class="sc-btn" id="btn-full" title="Fullscreen">⛶</button>
      </div>
    </section>

    <!-- ===== Retro Remote ===== -->
    <aside class="remote">
      <div class="seven-seg" id="current-channel">--</div>
      <div id="network-name">Loading…</div>

      <div class="row">
        <button class="btn btn-flex" id="chan-up">
          <span class="arrow">▲</span>
          <span class="label">Channel Up</span>
        </button>
      </div>
      <div class="row">
        <button class="btn btn-flex" id="chan-down">
          <span class="arrow">▼</span>
          <span class="label">Channel Down</span>
        </button>
      </div>

      <div id="entry">_</div>

      <div class="keypad" id="keypad">
        <button class="btn" data-digit="1">1</button>
        <button class="btn" data-digit="2">2</button>
        <button class="btn" data-digit="3">3</button>
        <button class="btn" data-digit="4">4</button>
        <button class="btn" data-digit="5">5</button>
        <button class="btn" data-digit="6">6</button>
        <button class="btn" data-digit="7">7</button>
        <button class="btn" data-digit="8">8</button>
        <button class="btn" data-digit="9">9</button>
        <button class="btn" id="key-clear">C</button>
        <button class="btn" data-digit="0">0</button>
        <button class="btn" id="key-enter">Enter</button>
      </div>

      <div id="title"></div>
      <div class="brand">RabbitEars TV<span>It's Up To You.</span></div>
    </aside>
  </div>

  <!-- ===== Channel editor ===== -->
  <div class="modal" id="modal" hidden>
    <div class="modal-box">
      <header>
        <h2>Channels</h2>
        <button class="sc-btn" id="modal-close">✕</button>
      </header>
      <p class="hint">Add any HLS (.m3u8), MP4/WebM, or YouTube URL — or set Type to
        <em>folder</em> and use 📁 to pick a folder that plays on a loop. Tick ⇄ to shuffle.
        Saved in this browser.</p>
      <div id="chan-editor"></div>
      <div class="editor-actions">
        <button class="btn primary" id="add-chan">+ Add channel</button>
        <button class="btn" id="reset-chan">Reset to defaults</button>
        <button class="btn primary" id="save-chan">Save &amp; Close</button>
      </div>
    </div>
  </div>

  <!-- ===== Folder browser ===== -->
  <div class="modal" id="browse-modal" hidden>
    <div class="modal-box">
      <header>
        <h2>Pick a folder</h2>
        <button class="sc-btn" id="browse-close">✕</button>
      </header>
      <div class="browse-path" id="browse-path">/</div>
      <div class="browse-list" id="browse-list"></div>
      <div class="editor-actions">
        <button class="btn" id="browse-up">⬆ Up</button>
        <button class="btn primary" id="browse-pick">Use this folder</button>
      </div>
    </div>
  </div>
</body>
</html>
